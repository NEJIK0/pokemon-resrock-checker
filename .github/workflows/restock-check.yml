name: Pokemon Restock Check

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-stock:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Hier installieren wir scrapfly-sdk statt Playwright!
      - name: Abhängigkeiten installieren
        run: |
          pip install scrapfly-sdk

      - name: Verfügbarkeit prüfen
        env:
          SCRAPFLY_API_KEY: ${{ secrets.SCRAPFLY_API_KEY }}
          SMTP_SERVER: smtp.gmail.com
          SMTP_PORT: 465
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        run: python restock_checker.py

      - name: Status speichern
        run: |
          git config user.name "restock-bot"
          git config user.email "actions@github.com"
          git add state.json
          git diff --quiet --cached || git commit -m "Status aktualisieren"
          git push || true
